# Meridian Care — Streamlit configuration.
# Committed to the repo so Windows and Linux checkouts render identically
# (same theme, same toolbar, no per-machine user config involved).

[theme]
base = "light"
primaryColor = "#16A34A"
secondaryBackgroundColor = "#E8FBEF"
backgroundColor = "#F4F7FA"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "type"
