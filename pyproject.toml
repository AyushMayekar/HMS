[project]
name = "ai-hospital-management"
version = "0.1.0"
description = "AI-powered Hospital Management System"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.141.1",
    "httpx",
    "joblib>=1.6.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-openai",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    # ML inference: model artifacts (app/ml/models/*.pkl) were trained with
    # scikit-learn 1.9.1 (verified via joblib InconsistentVersionWarning on
    # unpickle). Must match the training version to guarantee identical
    # preprocessing/transform semantics at inference time.
    "scikit-learn==1.9.1",
    # Streamlit ML/Analytics dashboard (frontend/) — visualization stays
    # frontend-side; the backend returns structured JSON only.
    "streamlit>=1.45.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
    "uvicorn>=0.53.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
